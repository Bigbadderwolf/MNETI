[package]
name        = "mneti-compliance"
version     = "0.3.0"
description = "MNETI Compliance — ZK proof verifier + Credential NFT + KYT/AML"
edition     = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name       = "mneti_compliance"

[features]
no-entrypoint  = []
no-idl         = []
no-log-ix-name = []
cpi            = ["no-entrypoint"]
default        = []
idl-build      = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
