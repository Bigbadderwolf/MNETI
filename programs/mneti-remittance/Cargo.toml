[package]
name = "mneti-remittance"
version = "0.1.0"
description = "MNETI Pan-African Remittance Corridor — USDC→KESH swap, 0.3% fee, SIX FX rates, Travel Rule integration, M-Pesa B2C payout trigger"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mneti_remittance"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl  = { version = "0.30.1", features = ["token"] }
spl-token   = { version = "4.0",    features = ["no-entrypoint"] }
