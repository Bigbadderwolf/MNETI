[package]
name = "mneti-travel-rule"
version = "0.1.0"
description = "MNETI FATF Travel Rule — VASP registry, IVMS101 encrypted payload anchoring, threshold enforcement, acknowledgement flow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mneti_travel_rule"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
