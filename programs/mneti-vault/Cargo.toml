[package]
name = "mneti-vault"
version = "0.1.0"
description = "MNETI Smart Vault System — Individual, Chama, SME, Enterprise, NGO vaults"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mneti_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }
spl-token = { version = "4.0", features = ["no-entrypoint"] }
proc-macro2 = "1.0.106"